<!doctype html>
<html><head><meta charset="utf-8"><style>
	html, body { margin: 0; padding: 0; }
	.banner {
		width: 100vw; height: 100vh;
		box-sizing: border-box;
		background:
			radial-gradient(90vw 130vh at 88% -20%, rgba(91, 140, 62, .28), transparent 60%),
			linear-gradient(120deg, #101710 0%, #17240f 55%, #223816 100%);
		display: flex; align-items: center;
		padding: 0 5.5vw;
		font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
		overflow: hidden; position: relative;
	}
	.mark { width: 21vh; height: 21vh; margin-right: 4.2vw; flex: none; filter: drop-shadow(0 1.2vh 3vh rgba(0,0,0,.45)); }
	.mark svg { width: 100%; height: 100%; display: block; }
	h1 { color: #fff; font-size: 12.5vh; font-weight: 800; letter-spacing: -.02em; margin: 0 0 1.4vh; line-height: 1.02; }
	h1 .for { color: #a9c98f; font-weight: 700; }
	p { color: rgba(255,255,255,.78); font-size: 6vh; margin: 0; font-weight: 500; letter-spacing: .01em; }
	.toggle {
		position: absolute; right: 5.5vw; top: 50%; transform: translateY(-50%);
		width: 21vh; height: 11vh; border-radius: 11vh;
		background: #1d2a53; border: .8vh solid rgba(255,255,255,.25);
		box-shadow: inset 0 1vh 3vh rgba(0,0,0,.5);
	}
	.toggle .knob { position: absolute; top: 1.1vh; right: 1.1vh; width: 8vh; height: 8vh; border-radius: 50%; background: #fff; box-shadow: 0 1vh 2.4vh rgba(0,0,0,.4); }
	.toggle .moon { position: absolute; top: 50%; left: 2.6vh; transform: translateY(-50%); width: 4.6vh; height: 4.6vh; border-radius: 50%; box-shadow: inset -1.2vh .8vh 0 0 #f6f1da; }
	.stars span { position: absolute; background: #fff; border-radius: 50%; opacity: .5; }
</style></head>
<body>
<div class="banner">
	<div class="stars">
		<span style="left:62%;top:18%;width:.7vh;height:.7vh;"></span>
		<span style="left:70%;top:64%;width:.5vh;height:.5vh;opacity:.35;"></span>
		<span style="left:56%;top:76%;width:.6vh;height:.6vh;opacity:.3;"></span>
		<span style="left:78%;top:30%;width:.5vh;height:.5vh;opacity:.4;"></span>
	</div>
	<div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8c3e"/><stop offset="1" stop-color="#27451c"/></linearGradient></defs><rect width="60" height="60" rx="14" fill="url(#g)"/><path d="M41 30.5A13 13 0 1 1 27 16a10.2 10.2 0 0 0 14 14.5z" fill="#fff"/><circle cx="20" cy="18" r="2" fill="#fff" opacity=".85"/><circle cx="16" cy="26" r="1.3" fill="#fff" opacity=".6"/></svg></div>
	<div>
		<h1>Dark Mode <span class="for">for GeneratePress</span></h1>
		<p>No flash. Real CSS, layer by layer. Your site after dark.</p>
	</div>
	<div class="toggle"><div class="moon"></div><div class="knob"></div></div>
</div>
</body></html>
